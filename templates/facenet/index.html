<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FaceNet | IVA VisionLab</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e293b;
            min-height: 100vh;
        }

        nav {
            background: #0f172a;
            color: white;
            padding: 18px 8%;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 12px;
            color: #0f172a;
        }

        .description {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .upload-box {
            border: 2px dashed #94a3b8;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .upload-box h3 {
            margin-bottom: 15px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
        }

        button {
            display: block;
            margin: 30px auto 0;
            padding: 13px 30px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #eff6ff;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .upload-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav>
        IVA VisionLab
    </nav>

    <div class="container">

        <div class="card">

            <h1>FaceNet</h1>

            <p class="description">
                Compare two face images using FaceNet embeddings
                and cosine similarity.
            </p>

            <form action="/facenet" method="POST" enctype="multipart/form-data">

                <div class="upload-section">

                    <div class="upload-box">
                        <h3>Image 1</h3>
                        <input
                            type="file"
                            name="image1"
                            accept="image/*"
                            required
                        >
                    </div>

                    <div class="upload-box">
                        <h3>Image 2</h3>
                        <input
                            type="file"
                            name="image2"
                            accept="image/*"
                            required
                        >
                    </div>

                </div>

                <button type="submit">
                    Compare Faces
                </button>

            </form>

            {% if result %}
                <div class="result">
                    {{ result }}
                </div>
            {% endif %}

            <a href="/" class="back">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
